name: Format agent branch

on:
  push:
    branches: ["agent/harden-rust-engine-ffi"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-rust-engine-ffi
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Apply rustfmt
        run: cargo +1.85.0 fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply rustfmt"
          git push origin HEAD:agent/harden-rust-engine-ffi
